name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build extension zip
        run: |
          bash build.sh
          ZIP_NAME="gdrive-universal-downloader-v${{ steps.version.outputs.VERSION }}.zip"
          cp chrome.zip "$ZIP_NAME"
          unzip -tq "$ZIP_NAME"
          for member in LICENSE hls.html hls-core.js hls-page.js hls-platform.js hls-storage.js lib/mux.js lib/MUX_JS_LICENSE.txt; do
            if ! unzip -Z -1 "$ZIP_NAME" | grep -F -x -- "$member" >/dev/null; then
              echo "Release archive is missing required package member: $member" >&2
              exit 1
            fi
          done
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Extract changelog for this version
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          sed -n "/^## \[$VERSION\]/,/^## \[/{/^## \[$VERSION\]/d;/^## \[/d;p;}" CHANGELOG.md > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          body_path: /tmp/release-notes.md
